server {
    listen 80;
    server_name api.h-ola.app;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.h-ola.app;

    ssl_certificate     /etc/letsencrypt/live/api.h-ola.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.h-ola.app/privkey.pem;

    # Proxy tất cả request về Spring Boot port 8080
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cấu hình CORS Header ở mức Nginx (Optional, but safe if Spring Security fails)
        # add_header 'Access-Control-Allow-Origin' 'https://h-ola.app' always;
        # add_header 'Access-Control-Allow-Credentials' 'true' always;
        # add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        # add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type' always;

        # Timeout cho long-polling (SockJS)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket (SockJS upgrade)
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
