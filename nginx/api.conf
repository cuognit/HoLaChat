server {
    listen 80;
    server_name api.h-ola.app;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name api.h-ola.app;

    client_max_body_size 500M;

    ssl_certificate     /etc/letsencrypt/live/h-ola.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/h-ola.app/privkey.pem;

    # Proxy tất cả request về Spring Boot port 8080
    location / {
        # Xử lý Preflight OPTIONS request tại Nginx
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://h-ola.app' always;
            add_header 'Access-Control-Allow-Credentials' 'true' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
            add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # Ẩn CORS header từ backend để tránh bị trùng lặp (duplicate)
        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';
        proxy_hide_header 'Access-Control-Allow-Methods';
        proxy_hide_header 'Access-Control-Allow-Headers';

        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Thêm CORS Header chuẩn hóa bởi Nginx
        add_header 'Access-Control-Allow-Origin' 'https://h-ola.app' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS, PATCH' always;
        add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With' always;

        # Timeout cho long-polling (SockJS)
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # WebSocket (SockJS upgrade)
    location /ws {
        proxy_pass http://127.0.0.1:8080/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Cực kỳ quan trọng để SockJS/WebSockets không bị buffering gây trễ thời gian thực
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
