server {
    listen 80;
    server_name h-ola.app www.h-ola.app;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name h-ola.app www.h-ola.app;

    ssl_certificate     /etc/letsencrypt/live/h-ola.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/h-ola.app/privkey.pem;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    root /var/www/hola/dist;
    index index.html;

    # Cache static assets (JS, CSS, images, fonts)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback - bắt buộc để React Router BrowserRouter hoạt động
    location / {
        try_files $uri $uri/ /index.html;
    }
}
